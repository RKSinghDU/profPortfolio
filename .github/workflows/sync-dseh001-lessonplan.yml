name: One-off sync of DSEH001 readers, decks and materials page with the Lesson Plan

on:
  push:
    paths:
      - '.github/workflows/sync-dseh001-lessonplan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify files
        run: |
          set -euo pipefail
          D=public/materials/dseh001
          get () { curl -sSL --retry 3 -X POST "$1" -o "$2"; echo "$3  $2" | sha256sum -c -; }
          get "https://temp.sh/vxSbe/DSEH001_Unit1_Reader_Why_HR_Is_Going_Digital.pdf" "$D/DSEH001_Unit1_Reader_Why_HR_Is_Going_Digital.pdf" d536f77d187c7c02df94be521d9dbc221b79a2efe91c180986efdef7904ab2b0
