      - name: Commit and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "RKSinghDU"
          git config user.email "208256921+RKSinghDU@users.noreply.github.com"
          git add public/materials/dseh001/*.pdf public/materials/index.html
          git rm -q .github/workflows/sync-dseh001-lessonplan.yml
          git commit -m "Sync DSEH001 with Lesson Plan: readers aligned week by week, retired citations removed from 12 decks, per-week reader links"
          git push
