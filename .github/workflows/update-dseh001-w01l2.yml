name: One-off update of DSEH001 W01 L2 deck

on:
  push:
    paths:
      - '.github/workflows/update-dseh001-w01l2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, commit and remove this workflow
        run: |
          set -euo pipefail
          F=public/materials/dseh001/DSEH001_W01_L2_Why_HR_Is_Going_Digital.pdf
          curl -sSL --retry 3 -X POST "https://temp.sh/NXkpg/DSEH001_W01_L2_Why_HR_Is_Going_Digital.pdf" -o "$F"
          echo "e057fd693acefc7562c887233d5e07c54c0e886a9ba1c00ad8615bbe2b93e4eb  $F" | sha256sum -c -
          git config user.name "RKSinghDU"
          git config user.email "208256921+RKSinghDU@users.noreply.github.com"
          git add "$F"
          git rm -q .github/workflows/update-dseh001-w01l2.yml
          git commit -m "DSEH001 W01 L2: slide 7 subtitle aligned with Slides source"
          git push
