name: One-off upload of DSEH001 Unit Readers

on:
  push:
    paths:
      - '.github/workflows/upload-dseh001-readers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify files
        run: |
          set -euo pipefail
          D=public/materials/dseh001
          get () { curl -sSL --retry 3 -X POST "$1" -o "$2"; echo "$3  $2" | sha256sum -c -; }
          get "https://temp.sh/PYYwJ/DSEH001_Unit1_Reader_Why_HR_Is_Going_Digital.pdf" "$D/DSEH001_Unit1_Reader_Why_HR_Is_Going_Digital.pdf" 729d2819d79f09c3adc6b1bbc6cd674ddb83854e1afce5720c7c2e39f9f73631
          get "https://temp.sh/SiOKY/DSEH001_Unit2_Reader_Building_and_Rolling_Out_Digital_HR.pdf" "$D/DSEH001_Unit2_Reader_Building_and_Rolling_Out_Digital_HR.pdf" 393b5839d2688f5a50b9462ba122d42fb91c6684237f0d4b1edec51f5d4e1c15
          get "https://temp.sh/WsrVm/DSEH001_Unit3_Reader_Analytics_Algorithms_and_Accountability.pdf" "$D/DSEH001_Unit3_Reader_Analytics_Algorithms_and_Accountability.pdf" c158b089fadc19fe7c2be389ac9f7ab4c24074a9c3e6f25cfc54dc1a7aa8c8ba
          get "https://temp.sh/GNGXe/DSEH001_Unit4_Reader_Future_of_Work_and_HR_Strategy.pdf" "$D/DSEH001_Unit4_Reader_Future_of_Work_and_HR_Strategy.pdf" 716b461d4dc82c2f98f6e7a15b5ac94b86192f821be3b0f3a9faadbcbff09565
          get "https://temp.sh/ItAuh/new_index.html" "public/materials/index.html" e7fd3a1ec5e0c44b02fffc613dedf3150ff028dbae287c507c3c728faee93d6b
      - name: Commit and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "RKSinghDU"
          git config user.email "208256921+RKSinghDU@users.noreply.github.com"
          git add public/materials/dseh001/DSEH001_Unit*_Reader_*.pdf public/materials/index.html
          git rm -q .github/workflows/upload-dseh001-readers.yml
          git commit -m "Add DSEH001 Unit Readers (Units 1 to 4); add Unit Readers section to materials page"
          git push
