name: One-off upload of DSEH004 lecture PDFs

on:
  push:
    paths:
      - '.github/workflows/upload-dseh004-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify PDFs
        run: |
          set -euo pipefail
          D=public/materials/dseh004
          mkdir -p "$D"
          fetch () {
            curl -sSL --retry 3 -X POST "https://temp.sh/$1/$2" -o "$D/$2"
            echo "$3  $D/$2" | sha256sum -c -
          }
          fetch iJjIS DSEH004_W08_L1_Do_Generations_Explain_Anything.pdf 81923946ded2713e9cd82b4a89479fd79076fc30dc4de869f0adc41c2a008aad
          fetch TeqRK DSEH004_W08_L2_The_Lifecycle_and_Wellbeing.pdf 864ca9ae0ecf86fd909628ffb545dc39b2dda66ceafa4d747eac4ef9cdbab20b
          fetch gIcjU DSEH004_W08_L3_Segments_Differentiation_and_Fairness.pdf c203e036501071bf9fb88a644247d6820018305228666d14edb7f38f2f0e0a8c
          fetch cefbe DSEH004_W09_L1_Strengths_and_Feedback.pdf 1ec978370f093a53717e298ee23de93e94f810757f2487aceae7df236f32f134
          fetch hzayZ DSEH004_W09_L2_Internal_Mobility_and_the_Career_Plateau.pdf a586ab003857a33692031b7dc99de0c92b480d78bcc7e9bcb794da1dce865a6e
          fetch OYmzt DSEH004_W09_L3_Sponsorship_Meritocracy_and_Round5.pdf 89a74afedd7f424145e0e39d93e33b3100a975e052a55aba468ee7e90ed3ef60
      - name: Commit PDFs and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "RKSinghDU"
          git config user.email "208256921+RKSinghDU@users.noreply.github.com"
          git add public/materials/dseh004/*.pdf
          git rm -q .github/workflows/upload-dseh004-pdfs.yml
          git commit -m "Add DSEH004 Week 8 and 9 lecture PDFs"
          git push
