          fetch "https://temp.sh/cKhle/DSEH001_W11_L1_Strategy_for_Resilience_and_Agility.pdf" "public/materials/dseh001/DSEH001_W11_L1_Strategy_for_Resilience_and_Agility.pdf" "d90cffabea9f22ee299de4d28252e423e5598aee45aff0e009c94964e628fb13"
      - name: Commit the decks
        run: |
          git config user.name "RKSinghDU"
          git config user.email "208256921+RKSinghDU@users.noreply.github.com"
          git add public/materials/dseh001/*.pdf
          git commit -m "DSEH001 decks: recent sources, Lewin correction, 6th edition readings (16 PDFs, checksums verified)"
          git push
      - name: Remove this one-off workflow
        run: |
          git rm .github/workflows/dseh001-deck-upload.yml
          git commit -m "Remove one-off deck upload workflow"
          git push || echo "Could not remove the workflow automatically"
