<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Instructor Desk &middot; R K Singh</title>
<style>
:root{--bg:#F4F6FB;--card:#FFFFFF;--ink:#161B2B;--muted:#555E72;--line:#D6DDEE;--accent:#23305E;--accent2:#36488A;--err:#B23A32;--ok:#1E7A3E}
@media (prefers-color-scheme: dark){:root{--bg:#0E1220;--card:#131A2B;--ink:#E6EAF5;--muted:#A3ADC6;--line:#2A3352;--accent:#B7C6F2;--accent2:#8FA3E0;--err:#F08A80;--ok:#7FD39B}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0 0 6px;color:var(--accent)}
p.sub{margin:0 0 20px;color:var(--muted);font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=email],input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:10px;padding:11px 16px;border:1.5px solid var(--accent2)}
.primary{width:100%;margin-top:18px;background:var(--accent2);color:#fff;border-color:var(--accent2);font-weight:600}
.link{background:none;border:0;color:var(--accent2);padding:8px 0;margin-top:8px;text-decoration:underline}
.msg{min-height:1.2em;margin:12px 0 0;font-size:14px}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.5}
#hub{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#bar{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;display:none;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:14px}
#bar button{font-size:14px;padding:6px 12px;border-radius:999px;background:transparent;color:var(--ink);border-color:var(--line)}
#barmsg{color:var(--muted);padding:0 6px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="gate">
  <div class="card">
    <h1>Instructor Desk</h1>
    <p class="sub" id="gatesub">Private course hub for DSEH001 and DSEH004. Please sign in.</p>

    <form id="signin">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <button class="link" type="button" id="forgot">Forgot password?</button>
    </form>

    <form id="newpw" class="hidden">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="10" required>
      <label for="pw2">Type it again</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="10" required>
      <button class="primary" type="submit">Save new password</button>
    </form>

    <p class="msg" id="msg" role="status"></p>
    <p class="foot">R K Singh, Senior Professor, Department of Commerce, Delhi School of Economics, University of Delhi</p>
  </div>
</div>

<iframe id="hub" title="Course hub"></iframe>
<div id="bar"><span id="barmsg"></span><button type="button" id="upd">Update hub file</button><button type="button" id="out">Sign out</button></div>
<input type="file" id="file" accept=".html,text/html" class="hidden">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL='https://rbrnfkgfznfvzptvakpe.supabase.co';
  var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJicm5ma2dmem5mdnpwdHZha3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNTY2MzQsImV4cCI6MjA5NjczMjYzNH0.DKHxFdCWNwSVUCBT772SX4XQiXKeyTUtFRSWZfk7E2w';
  var BUCKET='instructor-hub', FILE='hub.html';
  var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  var $=function(id){return document.getElementById(id);};
  function msg(t,kind){var m=$('msg');m.textContent=t||'';m.className='msg'+(kind?' '+kind:'');}
  function showGate(){ $('gate').style.display='';$('hub').style.display='none';$('bar').style.display='none'; }
  var recovering=/type=recovery/.test(location.hash), loaded=false;
  if(recovering){ $('signin').classList.add('hidden'); $('newpw').classList.remove('hidden'); $('gatesub').textContent='Choose a new password.'; }

  async function openHub(){
    if(loaded||recovering) return;
    msg('Opening your hub...');
    var r=await sb.storage.from(BUCKET).download(FILE);
    if(r.error){
      showGate();
      var e=String(r.error.message||r.error);
      if(/not.?found|Object not found/i.test(e)){ msg('Signed in, but no hub file has been uploaded yet.','err'); $('bar').style.display='flex'; $('barmsg').textContent='No hub file yet'; }
      else msg('The hub could not be opened: '+e,'err');
      return;
    }
    var html=await r.data.text();
    var f=$('hub'); f.srcdoc=html; f.style.display='block'; $('gate').style.display='none'; $('bar').style.display='flex'; $('barmsg').textContent='';
    loaded=true; msg('');
  }

  $('signin').addEventListener('submit',async function(e){
    e.preventDefault(); msg('Signing in...');
    var r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});
    if(r.error){ msg('Sign in failed. Check your email and password.','err'); return; }
    $('pw').value=''; openHub();
  });

  $('forgot').addEventListener('click',async function(){
    var email=$('email').value.trim();
    if(!email){ msg('Type your email above first, then click Forgot password.','err'); return; }
    var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/desk/'});
    if(r.error) msg('The reset email could not be sent: '+r.error.message,'err');
    else msg('If this email is registered, a reset link is on its way. Open it on this device.','ok');
  });

  $('newpw').addEventListener('submit',async function(e){
    e.preventDefault();
    if($('pw1').value!==$('pw2').value){ msg('The two passwords do not match.','err'); return; }
    var r=await sb.auth.updateUser({password:$('pw1').value});
    if(r.error){ msg('The password could not be saved: '+r.error.message,'err'); return; }
    $('pw1').value=$('pw2').value=''; recovering=false;
    $('newpw').classList.add('hidden'); $('signin').classList.remove('hidden');
    msg('New password saved.','ok'); openHub();
  });

  $('out').addEventListener('click',async function(){
    await sb.auth.signOut(); loaded=false; $('hub').srcdoc=''; showGate(); msg('You are signed out.','ok');
  });

  $('upd').addEventListener('click',function(){ $('file').click(); });
  $('file').addEventListener('change',async function(){
    var f=this.files[0]; this.value=''; if(!f) return;
    if(!confirm('Replace the hub with "'+f.name+'"?')) return;
    $('barmsg').textContent='Uploading...';
    var r=await sb.storage.from(BUCKET).upload(FILE,f,{upsert:true,contentType:'text/html'});
    if(r.error){ $('barmsg').textContent='Upload failed: '+r.error.message; return; }
    $('barmsg').textContent='Updated'; loaded=false; openHub();
  });

  sb.auth.onAuthStateChange(function(evt,session){
    if(evt==='PASSWORD_RECOVERY'){
      recovering=true; showGate(); $('signin').classList.add('hidden'); $('newpw').classList.remove('hidden');
      $('gatesub').textContent='Choose a new password.'; msg('');
    }
  });

  sb.auth.getSession().then(function(r){ if(r.data&&r.data.session) openHub(); });
})();
</script>
</body>
</html>
